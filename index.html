<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring BMN Eks Idle - DJKN KPKNL Metro</title>
    <style>
        :root {
            --djkn-blue: #0A2240;       
            --djkn-blue-hover: #13345d;
            --djkn-gold: #D4AF37;       
            --bg-light: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --border-color: #CBD5E1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-light); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: var(--text-main);
        }

        /* --- HALAMAN LOGIN --- */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .login-card {
            background-color: var(--card-bg);
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(10, 34, 64, 0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border-top: 6px solid var(--djkn-gold);
            border-bottom: 2px solid var(--djkn-blue);
        }
        .login-logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .login-card h2 { 
            color: var(--djkn-blue); 
            margin-top: 0; 
            margin-bottom: 5px;
            font-size: 22px; 
            font-weight: 700;
        }
        .login-card p { 
            color: #64748B; 
            font-size: 14px; 
            margin-bottom: 20px; 
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            background-color: #F8FAFC;
            color: var(--text-main);
            outline: none;
        }
        .login-card input:focus { border-color: var(--djkn-gold); }
        .login-card button {
            width: 100%;
            background-color: var(--djkn-blue);
            color: var(--djkn-gold);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-card button:hover { background-color: var(--djkn-blue-hover); }
        #error-msg { color: #DC2626; font-size: 13px; margin-top: 10px; display: none; font-weight: 500; }

        /* --- KOTAK UTAMA DASHBOARD PRESENTASI --- */
        #main-app {
            display: none;
            width: 95%;
            max-width: 1080px;
        }
        .dashboard-container { 
            background-color: var(--card-bg); 
            padding: 25px 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(10, 34, 64, 0.08); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 560px;
            border-top: 8px solid var(--djkn-gold); 
            border: 1px solid var(--border-color);
        }
        
        .dashboard-header { 
            border-bottom: 2px solid #E2E8F0; 
            padding-bottom: 8px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
        }
        .dashboard-header h3 { 
            margin: 0; 
            color: var(--djkn-blue); 
            font-size: 13px; 
            letter-spacing: 1px;
            text-transform: uppercase; 
            font-weight: 700;
        }
        #slide-counter { 
            font-weight: 700; 
            color: var(--djkn-blue); 
            font-size: 13px; 
            background-color: #FEF3C7; 
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #F59E0B;
        }

        h1 { 
            color: var(--djkn-blue); 
            margin-top: 0; 
            margin-bottom: 10px; 
            font-size: 19px; 
            font-weight: 700;
        }
        .content-box { 
            font-size: 13px; 
            color: var(--text-main); 
            line-height: 1.45; 
            flex-grow: 1;
        }
        ul { margin-top: 2px; padding-left: 18px; }
        li { margin-bottom: 4px; }
        
        /* Layout Grid 2 Foto Sampingan Aset */
        .slide-grid-dual {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .slide-text-dual { flex: 1.2; }
        .slide-images-dual {
            display: flex;
            gap: 12px;
            width: 420px;
            flex-shrink: 0;
        }
        .img-card {
            flex: 1;
            text-align: center;
        }
        .img-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--djkn-gold);
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }
        .img-caption { 
            font-size: 11px; 
            color: #64748B; 
            margin-top: 4px; 
            font-style: italic; 
            font-weight: 500;
        }

        /* Layout Khusus 2 Maps Berjajar (Lampura & Lamteng) */
        .maps-grid-duo {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .maps-card {
            flex: 1;
            text-align: center;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
        }
        .maps-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--djkn-gold);
        }
        .maps-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--djkn-blue);
            margin-bottom: 6px;
        }
        .maps-desc {
            font-size: 11px;
            color: #64748B;
            margin-top: 6px;
            line-height: 1.3;
        }

        /* Layout Khusus 1 Maps Besar (Kota Metro) */
        .maps-single-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            max-width: 550px;
            margin: 0 auto;
            text-align: center;
        }
        .maps-single-container img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid var(--djkn-gold);
            margin-bottom: 8px;
        }

        /* Layout Overview Grafik */
        .overview-grid {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        .overview-text { flex: 1.3; }
        .overview-chart {
            flex: 1;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
        }
        .chart-bar-container {
            margin-bottom: 12px;
        }
        .chart-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--djkn-blue);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .chart-bar-bg {
            background-color: #E2E8F0;
            border-radius: 4px;
            height: 18px;
            width: 100%;
            overflow: hidden;
        }
        .chart-bar-fill {
            background-color: var(--djkn-gold);
            height: 100%;
            text-align: right;
            padding-right: 8px;
            font-size: 11px;
            font-weight: bold;
            color: var(--djkn-blue);
            line-height: 18px;
        }
        .chart-bar-fill.blue {
            background-color: var(--djkn-blue);
            color: #FFFFFF;
        }

        /* Tampilan Slide Penutup */
        .closing-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            padding: 30px 0;
        }
        .closing-slide h2 {
            color: var(--djkn-blue);
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .closing-slide p {
            color: #64748B;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .closing-badge {
            background-color: #FEF3C7;
            color: var(--djkn-blue);
            border: 1px solid var(--djkn-gold);
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
        }

        .footer-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid #E2E8F0; 
            padding-top: 10px; 
            margin-top: 10px;
        }
        .btn-nav { 
            background-color: var(--djkn-blue); 
            color: var(--djkn-gold); 
            border: 1px solid var(--djkn-gold);
            padding: 8px 18px; 
            font-size: 13px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-nav:hover { background-color: var(--djkn-blue-hover); }
        
        .btn-nav:disabled {
            background-color: #E2E8F0 !important;
            color: #94A3B8 !important;
            border-color: #CBD5E1 !important;
            cursor: not-allowed;
        }

        #end-notice {
            display: none;
            color: #D97706;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-overlay">

            <input type="password" id="password-input" placeholder="••••••••••••">
            <button onclick="checkPassword()">MASUK APLIKASI</button>
            <div id="error-msg">Password salah! Silakan coba lagi.</div>
        </div>
    </div>

    <!-- UTAMA -->
    <div id="main-app">
        <div class="dashboard-container">
            <div>
                <div class="dashboard-header">
                    <div class="logo-title-group">
                        <img src="logo.png" alt="Logo Instansi" class="logo-img" onerror="this.style.display='none'">
                        <h3>KPKNL Metro • Pengelolaan BMN Eks Idle</h3>

                    <span id="slide-counter">Slide 1 dari 10</span>
                </div>
                
                <h1 id="slide-title">Judul Slide</h1>
                <div class="content-box" id="slide-content"></div>
            </div>
            
            <div class="footer-nav">
                <button class="btn-nav" id="btn-prev" onclick="prevSlide()">← Sebelumnya</button>
                <span id="end-notice">Akhir Presentasi</span>
                <button class="btn-nav" id="btn-next" onclick="nextSlide()">Selanjutnya →</button>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD_BENAR = "kpknlmetro2026";

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (inputVal === PASSWORD_BENAR) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                updateSlide();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { checkPassword(); }
        });

        let currentSlide = 0;

        function updateSlide() {
            document.getElementById('slide-title').innerText = slides[currentSlide].title;
            document.getElementById('slide-content').innerHTML = slides[currentSlide].content;
            document.getElementById('slide-counter').innerText = `Slide ${currentSlide + 1} dari ${slides.length}`;

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const endNotice = document.getElementById('end-notice');

            if (currentSlide === 0) {
                btnPrev.disabled = true;
            } else {
                btnPrev.disabled = false;
            }

            if (currentSlide === slides.length - 1) {
                btnNext.disabled = true;
                endNotice.style.display = 'inline-block';
            } else {
                btnNext.disabled = false;
                endNotice.style.display = 'none';
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }
    </script>
